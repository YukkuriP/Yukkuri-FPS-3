name: Godot 4.7.2 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Install Blender for ship mesh generation check
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy

      - name: Generate ship exterior and verify GLB export
        run: |
          blender --background --python blender/generate_ship.py
          test -s blender/fleet_destroyer_exterior.glb || test -s fleet_destroyer_exterior.glb

      - name: Print engine version
        run: godot --version

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Headless startup smoke test
        run: godot --headless --path . --quit-after 5

      - name: Ship geometry and collision smoke test
        run: godot --headless --path . --script res://tests/ship_smoke_test.gd

      - name: Install software display for visual test
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri fonts-noto-cjk

      - name: Capture ship exterior and interior views
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/ship_visual_capture.gd

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-visual-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
